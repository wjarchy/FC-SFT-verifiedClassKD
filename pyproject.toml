[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-class-kd"
version = "0.1.0"
description = "Function Calling Class-Level Distillation — Fast Pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.46.0",
    "datasets>=2.18.0",
    "peft>=0.13.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.44.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "hypothesis>=6.115.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
